# One server: Caddy (web + HTTPS), the account backend, and the API with its worker.
# Run from the repository root:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: customer-intelligence

services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
      MAX_REQUEST_MB: ${MAX_REQUEST_MB:-820}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend, api]

  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      APP_ORIGIN: https://${DOMAIN}

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${DOMAIN}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      CI_ALLOWED_HOSTS: '["${DOMAIN}","api","localhost"]'
      NEBIUS_API_KEY: ${NEBIUS_API_KEY}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL}
      NEBIUS_MODEL: ${NEBIUS_MODEL}
      CI_MAX_UPLOAD_MB: ${CI_MAX_UPLOAD_MB:-200}
      CI_MAX_ROWS: ${CI_MAX_ROWS:-1000000}
      CI_WORKER_TIMEOUT_SECONDS: ${CI_WORKER_TIMEOUT_SECONDS:-1800}
    volumes:
      - app-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data: # customer files, models, scores and per-account SQLite workspaces
  caddy-data: # HTTPS certificates
  caddy-config:
